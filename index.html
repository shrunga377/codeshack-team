<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f3ef" />
    <title>Daymark — your day, at a glance</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #20231f;
        --muted: #777a73;
        --line: #e8e7e1;
        --paper: #fffefa;
        --canvas: #f4f3ef;
        --green: #385c48;
        --green-soft: #eaf0e8;
        --lime: #d8ed72;
        --shadow: 0 24px 70px rgb(31 39 31 / 8%);
      }

      * { box-sizing: border-box; }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        background:
          radial-gradient(ellipse at 50% 0%, rgb(255 255 255 / 78%), transparent 58%),
          var(--canvas);
        color: var(--ink);
        font-family: "Avenir Next", Avenir, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      button, input { font: inherit; }
      button { color: inherit; }

      .page {
        width: min(100% - 40px, 760px);
        margin: 0 auto;
        padding: 44px 0 36px;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 62px;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        color: var(--ink);
        font-size: 15px;
        font-weight: 750;
        letter-spacing: -.04em;
        text-decoration: none;
      }

      .brand-mark {
        display: grid;
        width: 30px;
        height: 30px;
        place-items: center;
        border-radius: 10px;
        background: var(--green);
        color: white;
      }

      .brand-mark svg { width: 17px; height: 17px; }

      .today-label {
        display: flex;
        align-items: center;
        gap: 7px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 600;
      }

      .today-label svg { width: 15px; height: 15px; }

      .intro { margin-bottom: 30px; }

      .eyebrow {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 0 0 13px;
        color: var(--green);
        font-size: 11px;
        font-weight: 750;
        letter-spacing: .13em;
        text-transform: uppercase;
      }

      .eyebrow::before {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--lime);
        content: "";
      }

      h1 {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(39px, 7vw, 58px);
        font-weight: 400;
        letter-spacing: -.055em;
        line-height: 1.05;
      }

      .subtitle {
        margin: 14px 0 0;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.6;
      }

      .todo-card {
        overflow: hidden;
        border: 1px solid rgb(38 44 36 / 5%);
        border-radius: 18px;
        background: var(--paper);
        box-shadow: var(--shadow);
      }

      .card-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 23px 26px 19px;
      }

      .list-title {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 0;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: -.02em;
      }

      .count {
        display: inline-grid;
        min-width: 23px;
        height: 23px;
        padding: 0 6px;
        place-items: center;
        border-radius: 8px;
        background: var(--green-soft);
        color: var(--green);
        font-size: 11px;
        font-weight: 700;
      }

      .progress-label { color: var(--muted); font-size: 11px; }

      .progress-track {
        height: 3px;
        background: #f0f0eb;
      }

      .progress-fill {
        width: 0;
        height: 100%;
        background: var(--green);
        transition: width 240ms ease;
      }

      .add-form {
        display: flex;
        gap: 10px;
        padding: 20px 26px;
        border-bottom: 1px solid var(--line);
      }

      .task-input {
        flex: 1;
        min-width: 0;
        height: 46px;
        padding: 0 14px;
        border: 1px solid var(--line);
        border-radius: 10px;
        outline: none;
        background: #fff;
        color: var(--ink);
        font-size: 13px;
        transition: border-color 160ms ease, box-shadow 160ms ease;
      }

      .task-input::placeholder { color: #a1a39c; }
      .task-input:focus { border-color: #839b88; box-shadow: 0 0 0 3px rgb(56 92 72 / 10%); }

      .add-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        min-width: 104px;
        height: 46px;
        padding: 0 15px;
        border: 0;
        border-radius: 10px;
        background: var(--green);
        color: white;
        cursor: pointer;
        font-size: 12px;
        font-weight: 700;
        transition: background 160ms ease, transform 160ms ease;
      }

      .add-button:hover { background: #294a38; }
      .add-button:active { transform: scale(.98); }
      .add-button svg { width: 15px; height: 15px; }

      .filters {
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 15px 26px 8px;
      }

      .filter-button {
        padding: 7px 10px;
        border: 0;
        border-radius: 7px;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        font-size: 11px;
        font-weight: 650;
        transition: background 150ms ease, color 150ms ease;
      }

      .filter-button:hover { background: #f5f5f0; color: var(--ink); }
      .filter-button[aria-pressed="true"] { background: var(--green-soft); color: var(--green); }

      .task-list {
        min-height: 206px;
        margin: 0;
        padding: 0 26px 10px;
        list-style: none;
      }

      .task-row {
        display: flex;
        align-items: center;
        gap: 13px;
        min-height: 57px;
        border-bottom: 1px solid #f0efe9;
        animation: arrive 220ms ease both;
      }

      .task-row:last-child { border-bottom: 0; }

      .check-button {
        display: grid;
        flex: 0 0 19px;
        width: 19px;
        height: 19px;
        padding: 0;
        place-items: center;
        border: 1.5px solid #c9cbc3;
        border-radius: 6px;
        background: transparent;
        color: white;
        cursor: pointer;
        transition: background 160ms ease, border-color 160ms ease, transform 160ms ease;
      }

      .check-button:hover { border-color: var(--green); transform: scale(1.08); }
      .check-button svg { width: 12px; height: 12px; opacity: 0; transform: scale(.7); transition: .16s ease; }
      .task-row.is-done .check-button { border-color: var(--green); background: var(--green); }
      .task-row.is-done .check-button svg { opacity: 1; transform: scale(1); }

      .task-text {
        flex: 1;
        min-width: 0;
        color: #3d403b;
        font-size: 13px;
        line-height: 1.45;
        overflow-wrap: anywhere;
        transition: color 160ms ease;
      }

      .task-row.is-done .task-text { color: #a1a39c; text-decoration: line-through; text-decoration-color: #b7b9b2; }

      .delete-button {
        display: grid;
        flex: 0 0 30px;
        width: 30px;
        height: 30px;
        padding: 0;
        place-items: center;
        border: 0;
        border-radius: 8px;
        background: transparent;
        color: #9b9d96;
        cursor: pointer;
        opacity: 0;
        transition: opacity 140ms ease, background 140ms ease, color 140ms ease;
      }

      .task-row:hover .delete-button, .delete-button:focus-visible { opacity: 1; }
      .delete-button:hover { background: #f9ece9; color: #a64e3e; }
      .delete-button svg { width: 15px; height: 15px; }

      .empty-state {
        display: grid;
        min-height: 190px;
        align-content: center;
        justify-items: center;
        color: var(--muted);
        text-align: center;
      }

      .empty-icon {
        display: grid;
        width: 42px;
        height: 42px;
        margin-bottom: 12px;
        place-items: center;
        border-radius: 14px;
        background: #f4f5ef;
        color: var(--green);
      }

      .empty-icon svg { width: 20px; height: 20px; }
      .empty-state strong { margin-bottom: 5px; color: #444740; font-size: 13px; font-weight: 650; }
      .empty-state span { font-size: 11px; }

      .card-foot {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 48px;
        padding: 10px 26px;
        border-top: 1px solid var(--line);
        color: #92948d;
        font-size: 10px;
      }

      .clear-button {
        padding: 5px 0 5px 10px;
        border: 0;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        font-size: 10px;
        transition: color 140ms ease;
      }

      .clear-button:hover { color: #a64e3e; }
      .clear-button:disabled { cursor: default; opacity: .45; }

      .page-foot {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        margin-top: 24px;
        color: #92948d;
        font-size: 11px;
      }

      .page-foot svg { width: 13px; height: 13px; color: var(--green); }

      button:focus-visible { outline: 3px solid rgb(56 92 72 / 30%); outline-offset: 2px; }

      @keyframes arrive {
        from { opacity: 0; transform: translateY(5px); }
        to { opacity: 1; transform: translateY(0); }
      }

      @media (max-width: 560px) {
        .page { width: min(100% - 28px, 760px); padding-top: 26px; }
        .topbar { margin-bottom: 45px; }
        .card-head { padding: 20px 17px 16px; }
        .add-form { gap: 8px; padding: 15px 16px; }
        .add-button { min-width: 46px; padding: 0 13px; }
        .add-button span { display: none; }
        .filters { padding: 13px 16px 7px; }
        .task-list { padding-right: 16px; padding-left: 16px; }
        .card-foot { padding-right: 17px; padding-left: 17px; }
        .delete-button { opacity: 1; }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <header class="topbar">
        <a class="brand" href="#" aria-label="Daymark home">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 20 20" fill="none"><path d="m5.2 10.3 3.1 3.1 6.6-7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span>
          daymark
        </a>
        <div class="today-label">
          <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><rect x="3.2" y="4.5" width="13.6" height="12" rx="2.2" stroke="currentColor" stroke-width="1.4"/><path d="M6.5 2.8v3.4M13.5 2.8v3.4M3.5 8h13" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
          <time id="today"></time>
        </div>
      </header>

      <section class="intro" aria-labelledby="page-title">
        <p class="eyebrow">A little more room to think</p>
        <h1 id="page-title">Make today<br />count.</h1>
        <p class="subtitle">A clear list makes space for your best work.</p>
      </section>

      <section class="todo-card" aria-labelledby="list-heading">
        <div class="card-head">
          <h2 class="list-title" id="list-heading">Today’s list <span class="count" id="task-count">0</span></h2>
          <span class="progress-label" id="progress-label">A fresh start</span>
        </div>
        <div class="progress-track" aria-hidden="true"><div class="progress-fill" id="progress-fill"></div></div>

        <form class="add-form" id="add-form">
          <label class="sr-only" for="task-input">Add a task</label>
          <input class="task-input" id="task-input" name="task" type="text" maxlength="120" placeholder="What’s on your mind?" autocomplete="off" />
          <button class="add-button" type="submit" aria-label="Add task">
            <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M10 4v12M4 10h12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            <span>Add task</span>
          </button>
        </form>

        <div class="filters" role="group" aria-label="Filter tasks">
          <button class="filter-button" type="button" data-filter="all" aria-pressed="true">All</button>
          <button class="filter-button" type="button" data-filter="active" aria-pressed="false">To do</button>
          <button class="filter-button" type="button" data-filter="done" aria-pressed="false">Done</button>
        </div>
        <ul class="task-list" id="task-list" aria-live="polite"></ul>
        <footer class="card-foot">
          <span id="remaining-label">Your list is yours alone.</span>
          <button class="clear-button" id="clear-completed" type="button" disabled>Clear completed</button>
        </footer>
      </section>

      <footer class="page-foot">
        <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M10 16.3s-6.5-3.8-6.5-8.2a3.6 3.6 0 0 1 6.5-2.2 3.6 3.6 0 0 1 6.5 2.2c0 4.4-6.5 8.2-6.5 8.2Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
        One thing at a time.
      </footer>
    </main>

    <style>.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}</style>
    <script>
      const storageKey = "daymark-tasks-v1";
      const starterTasks = [
        { id: "starter-1", text: "Take a few minutes to plan the day", done: true },
        { id: "starter-2", text: "Make progress on the thing that matters most", done: false },
        { id: "starter-3", text: "Step away for a proper lunch break", done: false }
      ];
      const taskList = document.querySelector("#task-list");
      const taskInput = document.querySelector("#task-input");
      const countLabel = document.querySelector("#task-count");
      const progressLabel = document.querySelector("#progress-label");
      const progressFill = document.querySelector("#progress-fill");
      const remainingLabel = document.querySelector("#remaining-label");
      const clearButton = document.querySelector("#clear-completed");
      let tasks = loadTasks();
      let currentFilter = "all";

      document.querySelector("#today").textContent = new Intl.DateTimeFormat("en", {
        weekday: "short", month: "short", day: "numeric"
      }).format(new Date());

      function loadTasks() {
        try {
          const saved = localStorage.getItem(storageKey);
          return saved === null ? starterTasks : JSON.parse(saved);
        } catch {
          return starterTasks;
        }
      }

      function saveTasks() {
        localStorage.setItem(storageKey, JSON.stringify(tasks));
      }

      function icon(name) {
        if (name === "check") return '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="m3.5 8.2 3 3 6-6.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
        if (name === "trash") return '<svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M4.5 6h11M8 6V4.5h4V6m2.5 0-.6 9.1a1 1 0 0 1-1 .9H7.1a1 1 0 0 1-1-.9L5.5 6m2.7 2.2v5m3.6-5v5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
        return '<svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M5.5 10h9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>';
      }

      function render() {
        const visibleTasks = tasks.filter(task => {
          if (currentFilter === "active") return !task.done;
          if (currentFilter === "done") return task.done;
          return true;
        });
        const completed = tasks.filter(task => task.done).length;
        const remaining = tasks.length - completed;
        const progress = tasks.length ? Math.round(completed / tasks.length * 100) : 0;

        countLabel.textContent = remaining;
        progressLabel.textContent = tasks.length ? `${completed} of ${tasks.length} done` : "A fresh start";
        progressFill.style.width = `${progress}%`;
        remainingLabel.textContent = remaining ? `${remaining} ${remaining === 1 ? "task" : "tasks"} left to go` : (tasks.length ? "Everything’s done. Nice work." : "Your list is yours alone.");
        clearButton.disabled = completed === 0;

        if (!visibleTasks.length) {
          const message = currentFilter === "done"
            ? ["Nothing checked off yet", "Your finished tasks will show up here."]
            : currentFilter === "active"
              ? ["All caught up", "Enjoy the breathing room, or add another task."]
              : ["A little breathing room", "Add a task above whenever you’re ready."];
          taskList.innerHTML = `<li class="empty-state"><span class="empty-icon">${icon("sparkle")}</span><strong>${message[0]}</strong><span>${message[1]}</span></li>`;
          return;
        }

        taskList.innerHTML = visibleTasks.map(task => `
          <li class="task-row${task.done ? " is-done" : ""}" data-id="${escapeAttribute(task.id)}">
            <button class="check-button" type="button" aria-label="${task.done ? "Mark as not done" : "Mark as done"}" aria-pressed="${task.done}">${icon("check")}</button>
            <span class="task-text">${escapeHtml(task.text)}</span>
            <button class="delete-button" type="button" aria-label="Delete ${escapeAttribute(task.text)}">${icon("trash")}</button>
          </li>`).join("");
      }

      function escapeHtml(value) {
        return value.replace(/[&<>"']/g, char => ({
          "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
        })[char]);
      }

      function escapeAttribute(value) {
        return escapeHtml(String(value));
      }

      document.querySelector("#add-form").addEventListener("submit", event => {
        event.preventDefault();
        const text = taskInput.value.trim();
        if (!text) {
          taskInput.focus();
          return;
        }
        tasks.unshift({ id: crypto.randomUUID(), text, done: false });
        currentFilter = "all";
        document.querySelectorAll(".filter-button").forEach(button => {
          button.setAttribute("aria-pressed", String(button.dataset.filter === currentFilter));
        });
        saveTasks();
        render();
        taskInput.value = "";
        taskInput.focus();
      });

      taskList.addEventListener("click", event => {
        const row = event.target.closest(".task-row");
        if (!row) return;
        const index = tasks.findIndex(task => task.id === row.dataset.id);
        if (index < 0) return;
        if (event.target.closest(".check-button")) tasks[index].done = !tasks[index].done;
        if (event.target.closest(".delete-button")) tasks.splice(index, 1);
        saveTasks();
        render();
      });

      document.querySelectorAll(".filter-button").forEach(button => {
        button.addEventListener("click", () => {
          currentFilter = button.dataset.filter;
          document.querySelectorAll(".filter-button").forEach(filter => {
            filter.setAttribute("aria-pressed", String(filter === button));
          });
          render();
        });
      });

      clearButton.addEventListener("click", () => {
        tasks = tasks.filter(task => !task.done);
        saveTasks();
        render();
      });

      render();
    </script>
  </body>
</html>
